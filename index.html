<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El escritorio de Rubén</title>
  <style>
    :root {
      --azul-oscuro: #0f172a;
      --azul-medio: #163a5f;
      --azul-claro: #4f8fc9;
      --blanco: #ffffff;
      --gris-oscuro: #334155;
      --rojo: #b91c1c;
      --sombra: rgba(15, 23, 42, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f4f8ff 0%, #dfeaf7 100%);
      color: var(--azul-oscuro);
    }

    body { min-height: 100vh; }

    .pantalla-inicio {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.4), transparent 30%),
        linear-gradient(135deg, var(--azul-oscuro), var(--azul-medio), var(--azul-claro));
      color: var(--blanco);
    }

    .contenido-portada {
      max-width: 700px;
      padding: 2.5rem 2rem;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .pantalla-inicio h1 {
      margin: 0;
      font-size: clamp(2.7rem, 7vw, 5rem);
      line-height: 1.1;
      letter-spacing: 0.05em;
    }

    .imagen-portada {
      display: block;
      width: min(100%, 440px);
      height: auto;
      margin: 1.5rem auto;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    .pantalla-inicio p {
      margin: 1.2rem 0 2rem;
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: rgba(255,255,255,0.9);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .btn:focus-visible, input:focus-visible {
      outline: 3px solid #ffdc73;
      outline-offset: 4px;
    }

    .btn-primary { background: var(--blanco); color: var(--azul-medio); }
    .btn-secondary { background: var(--azul-medio); color: var(--blanco); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .barra-superior {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .zona-personal {
      width: min(100%, 360px);
      padding: 1rem;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(22,58,95,0.12);
      border-radius: 18px;
      box-shadow: 0 8px 22px var(--sombra);
      text-align: center;
    }

    .zona-personal .formulario { margin-top: 1rem; }

    .proyectos {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
      padding: 3rem 2rem 8rem;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(180deg, #f7a36f, #f7c37b 48%, #9f6172 100%);
      background-size: 100% 200%;
      animation: atardecer-cielo 24s ease-in-out infinite alternate;
    }

    .proyectos::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 36% 0 0;
      background:
        linear-gradient(135deg, transparent 0 30%, #5d526d 30% 52%, transparent 52%) 0 0 / 260px 100% repeat-x,
        linear-gradient(225deg, transparent 0 34%, #76536b 34% 58%, transparent 58%) 110px 18px / 300px 100% repeat-x,
        linear-gradient(to top, #34524a 0 30%, transparent 30%) 0 100% / 100% 100% no-repeat,
        repeating-linear-gradient(90deg, rgba(34, 65, 53, 0.7) 0 32px, transparent 32px 64px) 0 100% / 100% 48px no-repeat;
      image-rendering: pixelated;
      animation: paisaje-pixel 18s linear infinite alternate;
    }

    .proyectos::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: clamp(70px, 11vw, 130px);
      aspect-ratio: 1;
      top: 16%;
      left: 50%;
      border-radius: 50%;
      background: #ffeaa0;
      box-shadow: 0 0 35px 12px rgba(255, 220, 137, 0.42);
      animation: sol-poniente 18s ease-in-out infinite alternate;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      box-shadow: 0 12px 30px var(--sombra);
      padding: 2rem 1.5rem;
      border: 1px solid rgba(22,58,95,0.08);
      text-align: center;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      color: var(--azul-oscuro);
    }

    .subtitulo {
      font-size: 1.1rem;
      color: var(--gris-oscuro);
      margin: 0.8rem 0 1.5rem;
    }

    .imagen-proyecto {
      display: block;
      width: min(100%, 430px);
      height: auto;
      border-radius: 18px;
      margin: 1.5rem auto;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.15);
    }

    .proyecto-vacio {
      min-height: 180px;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      margin-top: 1.5rem;
      border: 2px dashed #bfd3eb;
      border-radius: 18px;
      color: var(--gris-oscuro);
      background: #f8fbff;
    }

    .formulario {
      max-width: 360px;
      margin: 1.5rem auto 0;
      display: grid;
      gap: 0.8rem;
      text-align: left;
    }

    .formulario label { font-weight: bold; color: var(--azul-oscuro); }

    .formulario input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid #bfd3eb;
      border-radius: 12px;
      font-size: 1rem;
      background: #fff;
    }

    .error {
      color: var(--rojo);
      min-height: 1.2em;
      font-weight: bold;
      margin-top: 0.3rem;
      text-align: center;
    }

    .imagen-error-wrap {
      width: min(100%, 400px);
      height: 220px;
      overflow: hidden;
      margin: 0.5rem auto 0;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      background: #000;
    }

    .imagen-error {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      transform: scale(1.05);
    }

    .info-personal {
      width: min(90%, 620px);
      margin: 4rem auto;
      padding: 3rem 2rem;
      text-align: center;
      background: var(--blanco);
      border: 1px solid #d9e7f9;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
      animation: aparecer 0.35s ease-out;
    }

    .avatar {
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      color: var(--blanco);
      background: linear-gradient(135deg, var(--azul-medio), var(--azul-claro));
      font-size: 2rem;
      font-weight: bold;
      box-shadow: 0 10px 24px rgba(22, 58, 95, 0.25);
    }

    .info-personal .etiqueta {
      margin: 0 0 0.6rem;
      color: var(--azul-claro);
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .info-personal h2 {
      margin: 0 0 0.7rem;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: var(--azul-oscuro);
    }

    .info-personal .curso {
      display: inline-block;
      margin: 0 0 2rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      color: var(--azul-medio);
      background: #edf5fd;
      font-size: 1.05rem;
      font-weight: bold;
    }

    [hidden] { display: none !important; }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes atardecer-cielo {
      from { background-position: 0 0; }
      to { background-position: 0 100%; }
    }

    @keyframes paisaje-pixel {
      from { background-position: 0 0, 110px 18px, 0 100%, 0 100%; }
      to { background-position: 45px 0, 70px 18px, 0 100%, 32px 100%; }
    }

    @keyframes sol-poniente {
      from { transform: translate(-50%, 0); opacity: 1; }
      to { transform: translate(-50%, 90px); opacity: 0.75; }
    }

    @media (max-width: 700px) {
      .contenido-portada { padding: 2rem 1.2rem; }
      .btn { width: 100%; }
      .barra-superior { justify-content: center; }
      .proyectos { grid-template-columns: 1fr; padding: 2rem 1rem 7rem; }
      .info-personal { padding: 2.5rem 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .proyectos, .proyectos::before, .proyectos::after { animation: none; }
    }
  </style>
</head>
<body>
  <section class="pantalla-inicio" id="pantalla-inicio">
    <div class="contenido-portada">
      <div class="badge">Proyecto escolar</div>
      <h1>El escritorio de Rubén</h1>
      <img class="imagen-portada" src="OIP.jpg" alt="Ilustración sobre las tecnologías de la información y la comunicación">
      <p>Bienvenido a mi página web personal</p>
      <button class="btn btn-primary" type="button" id="boton-inicio">Entrar</button>
    </div>
  </section>

  <main id="contenido" hidden>
    <div class="barra-superior">
      <aside class="zona-personal">
        <button class="btn btn-secondary" type="button" id="boton-informacion">Página personal</button>
        <form class="formulario" id="formulario-contrasena" hidden>
          <label for="contrasena">Introduce la contraseña:</label>
          <input id="contrasena" type="password" placeholder="Contraseña" autocomplete="off" required>
          <button type="submit" class="btn btn-secondary">Acceder</button>
          <div class="error" id="mensaje-error" aria-live="polite"></div>
          <div class="imagen-error-wrap" id="imagen-error-wrap" hidden>
            <img id="imagen-error" class="imagen-error" src="casi-pero-no.png.webp" alt="Casi... pero no">
          </div>
        </form>
      </aside>
    </div>

    <section class="proyectos" aria-label="Proyectos">
      <article class="card">
        <h2>Proyecto 1</h2>
        <p class="subtitulo">Ruben-house</p>
        <img
          class="imagen-proyecto"
          alt="Proyecto Ruben-house"
          src="https://github.com/user-attachments/assets/2399f6a0-ffcc-421a-9b70-b200dd2897fb">
      </article>

      <article class="card">
        <h2>Proyecto 2</h2>
        <p class="subtitulo">Segundo proyecto</p>
        <div class="proyecto-vacio">Aquí puedes añadir la información o imagen del segundo proyecto.</div>
      </article>
    </section>
  </main>

  <section id="seccion-personal" class="info-personal" hidden>
    <div class="avatar" aria-hidden="true">RA</div>
    <p class="etiqueta">Información personal</p>
    <h2>Rubén Andrés Arnaz</h2>
    <p class="curso">1ºBach</p>
    <button class="btn btn-secondary" type="button" id="boton-atras">← Volver atrás</button>
  </section>

  <script>
    const pantallaInicio = document.getElementById('pantalla-inicio');
    const contenido = document.getElementById('contenido');
    const botonInformacion = document.getElementById('boton-informacion');
    const formulario = document.getElementById('formulario-contrasena');
    const campoPassword = document.getElementById('contrasena');
    const mensajeError = document.getElementById('mensaje-error');
    const imagenErrorWrap = document.getElementById('imagen-error-wrap');
    const seccionPersonal = document.getElementById('seccion-personal');

    document.getElementById('boton-inicio').addEventListener('click', () => {
      pantallaInicio.hidden = true;
      contenido.hidden = false;
    });

    botonInformacion.addEventListener('click', () => {
      formulario.hidden = false;
      campoPassword.focus();
    });

    formulario.addEventListener('submit', (event) => {
      event.preventDefault();

      if (campoPassword.value === 'ruben') {
        mensajeError.textContent = '';
        imagenErrorWrap.hidden = true;
        contenido.hidden = true;
        seccionPersonal.hidden = false;
      } else {
        mensajeError.textContent = 'Contraseña incorrecta';
        imagenErrorWrap.hidden = false;
        campoPassword.value = '';
        campoPassword.focus();
      }
    });

    campoPassword.addEventListener('input', () => {
      mensajeError.textContent = '';
      imagenErrorWrap.hidden = true;
    });

    document.getElementById('boton-atras').addEventListener('click', () => {
      seccionPersonal.hidden = true;
      contenido.hidden = false;
      formulario.hidden = true;
      campoPassword.value = '';
      mensajeError.textContent = '';
      imagenErrorWrap.hidden = true;
      botonInformacion.focus();
    });
  </script>
</body>
</html>
